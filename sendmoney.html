<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar dinero &middot; Alke Wallet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container aw-page">
    <div class="row g-4">
      <div class="col-lg-7">
        <h1 class="h4 mb-3">Enviar dinero</h1>

        <div class="aw-hero mb-4">
          <p class="mb-1 text-white-50">Saldo disponible</p>
          <div class="saldo" id="saldoEnvio">$0</div>
        </div>

        <div id="msgEnvio" class="alert d-none" role="alert"></div>

        <form id="formEnvio" class="aw-forms-card" novalidate>
          <div class="mb-3 position-relative">
            <label for="buscarContacto" class="form-label">Buscar contacto</label>
            <input type="text" class="form-control" id="buscarContacto" autocomplete="off" placeholder="Escribe un nombre&hellip;" required>
            <div class="invalid-feedback">Selecciona o escribe un contacto.</div>
          </div>
          <input type="hidden" id="contactoEmail">

          <div class="mb-3">
            <label for="montoEnvio" class="form-label">Monto a enviar (CLP)</label>
            <input type="number" class="form-control" id="montoEnvio" min="1" step="1" required>
            <div class="invalid-feedback">Ingresa un monto mayor a 0.</div>
          </div>

          <div class="mb-3">
            <label for="descripcionEnvio" class="form-label">Motivo (opcional)</label>
            <input type="text" class="form-control" id="descripcionEnvio" maxlength="60">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-aw flex-grow-1">Transferir</button>
            <button type="button" id="btnRecibir" class="btn btn-outline-secondary">Simular recepcion</button>
          </div>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="aw-forms-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 mb-0">Mis contactos</h2>
            <button class="btn btn-sm btn-aw-accent" data-bs-toggle="modal" data-bs-target="#modalContacto">+ Nuevo</button>
          </div>
          <div class="list-group" id="listaContactos"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Bootstrap: agregar nuevo contacto -->
  <div class="modal fade" id="modalContacto" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formContacto" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Agregar nuevo contacto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="nuevoNombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nuevoNombre" required>
              <div class="invalid-feedback">Ingresa el nombre del contacto.</div>
            </div>
            <div class="mb-3">
              <label for="nuevoEmail" class="form-label">Correo</label>
              <input type="email" class="form-control" id="nuevoEmail" required>
              <div class="invalid-feedback">Ingresa un correo valido.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-aw">Guardar contacto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="aw-footer">Alke Wallet &middot; Proyecto formativo &mdash; Erick Noguera</footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sendmoney.js"></script>
</body>
</html>
