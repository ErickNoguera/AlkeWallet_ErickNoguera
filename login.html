<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion &middot; Alke Wallet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="aw-auth">
    <section class="aw-auth-card">
      <header class="text-center">
        <span class="aw-logo-dot aw-logo-lg"></span>
        <h1>Alke Wallet</h1>
        <p class="aw-sub">Ingresa a tu billetera digital</p>
      </header>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electronico</label>
          <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" required>
          <div class="invalid-feedback">Ingresa un correo valido.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contrasena</label>
          <input type="password" class="form-control" id="password" minlength="6" required>
          <div class="invalid-feedback">La contrasena debe tener al menos 6 caracteres.</div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="recordar">
          <label class="form-check-label" for="recordar">Recordar mi correo</label>
        </div>
        <button type="submit" id="btnLogin" class="btn btn-aw w-100 mb-2">Iniciar sesion</button>
        <button type="button" id="btnDemo" class="btn btn-link w-100 text-decoration-none">Usar credenciales de prueba</button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Cuenta demo: <strong>usuario@alke.com</strong> / <strong>alke1234</strong>
      </p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
