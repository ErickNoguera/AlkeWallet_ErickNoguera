<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depositar &middot; Alke Wallet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container aw-page">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1 class="h4 mb-3">Administracion de fondos</h1>

        <div class="aw-hero mb-4">
          <p class="mb-1 text-white-50">Saldo actual</p>
          <div class="saldo" id="saldoDeposito">$0</div>
        </div>

        <div id="msgDeposito" class="alert d-none" role="alert"></div>

        <form id="formDeposito" class="aw-forms-card" novalidate>
          <fieldset class="mb-3">
            <legend class="form-label">Tipo de operacion</legend>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="operacion" id="opDeposito" value="deposito" checked>
              <label class="form-check-label" for="opDeposito">Deposito</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="operacion" id="opRetiro" value="retiro">
              <label class="form-check-label" for="opRetiro">Retiro</label>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="monto" class="form-label">Monto (CLP)</label>
            <input type="number" class="form-control" id="monto" min="1" step="1" required>
            <div class="invalid-feedback">Ingresa un monto mayor a 0.</div>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripcion (opcional)</label>
            <input type="text" class="form-control" id="descripcion" maxlength="60">
          </div>

          <button type="submit" class="btn btn-aw w-100">Realizar operacion</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="aw-footer">Alke Wallet &middot; Proyecto formativo &mdash; Erick Noguera</footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/deposit.js"></script>
</body>
</html>
