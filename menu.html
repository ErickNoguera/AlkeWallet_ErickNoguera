<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio &middot; Alke Wallet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- La barra de navegacion se inyecta desde app.js (renderNavbar) -->
  <div id="navbar"></div>

  <main class="container aw-page">
    <section class="aw-hero aw-card-anim">
      <p class="mb-1 text-white-50">Saldo disponible</p>
      <div class="saldo" id="saldoActual">$0</div>
      <p class="mb-0 text-white-50">Bienvenido, <span id="nombreUsuario">usuario</span></p>
    </section>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3 aw-card-anim">
        <div class="card aw-summary-card p-3">
          <span class="label">Ingresos</span>
          <span class="value text-success" id="totalIngresos">$0</span>
        </div>
      </div>
      <div class="col-6 col-lg-3 aw-card-anim">
        <div class="card aw-summary-card p-3">
          <span class="label">Egresos</span>
          <span class="value text-danger" id="totalEgresos">$0</span>
        </div>
      </div>
      <div class="col-12 col-lg-6 aw-card-anim">
        <div class="card aw-summary-card p-3 h-100 d-flex flex-column justify-content-center">
          <span class="label mb-2">Acciones rapidas</span>
          <div class="d-flex flex-wrap gap-2">
            <a href="deposit.html" class="btn btn-aw btn-sm">Depositar</a>
            <a href="sendmoney.html" class="btn btn-aw-accent btn-sm">Enviar dinero</a>
            <a href="transactions.html" class="btn btn-outline-secondary btn-sm">Ver movimientos</a>
          </div>
        </div>
      </div>
    </div>

    <section class="aw-table-wrap">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">Ultimos movimientos</h2>
        <a href="transactions.html" class="small text-decoration-none">Ver todos</a>
      </div>
      <ul class="list-group list-group-flush" id="ultimosMovimientos"></ul>
    </section>
  </main>

  <footer class="aw-footer">Alke Wallet &middot; Proyecto formativo &mdash; Erick Noguera</footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
