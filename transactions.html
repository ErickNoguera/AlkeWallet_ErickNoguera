<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimientos &middot; Alke Wallet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container aw-page">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h1 class="h4 mb-0">Historial de transacciones</h1>
      <div class="d-flex align-items-center flex-wrap gap-2">
        <input type="search" id="buscarMovimiento" class="form-control form-control-sm"
               style="width:auto" placeholder="Buscar contraparte o motivo&hellip;">
        <label for="filtroTipo" class="form-label mb-0 small text-muted">Filtrar:</label>
        <select id="filtroTipo" class="form-select form-select-sm" style="width:auto">
          <option value="todos">Todos</option>
          <option value="deposito">Depositos</option>
          <option value="retiro">Retiros</option>
          <option value="enviado">Enviados</option>
          <option value="recibido">Recibidos</option>
        </select>
      </div>
    </div>

    <p class="text-muted small" id="resumenMovimientos">0 movimientos</p>

    <div class="aw-table-wrap">
      <div class="table-responsive">
        <table class="table align-middle" id="tablaMovimientos">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Contraparte</th>
              <th>Descripcion</th>
              <th class="text-end">Monto</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="aw-footer">Alke Wallet &middot; Proyecto formativo &mdash; Erick Noguera</footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/transactions.js"></script>
</body>
</html>
